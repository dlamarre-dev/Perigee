# Reusable data pipeline: fetch → validate → publish to the orphan `data` branch → redeploy Pages.
# Called by data-celestrak.yml and data-satcat.yml. Never computes positions (CLAUDE.md §2).
name: Data pipeline

on:
  workflow_call:
    inputs:
      command:
        description: 'pipeline/run.ts command (gp | satcat | horizons | rovers | sun)'
        required: true
        type: string
      args:
        description: 'Extra flags for pipeline/run.ts (only --bootstrap-past, from data-horizons.yml)'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check out current data branch
        run: |
          mkdir -p data-branch
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth 1 origin data
            git --work-tree=data-branch checkout FETCH_HEAD -- .
            git reset -q
          else
            echo "No data branch yet: starting empty."
          fi

      - name: Fetch and validate
        run: |
          # Only known flags pass (the value comes from a workflow input).
          case "$ARGS" in ''|--bootstrap-past) ;; *) echo "Unknown args: $ARGS"; exit 1 ;; esac
          npx tsx pipeline/run.ts ${{ inputs.command }} $ARGS --data-dir data-branch
        env:
          ARGS: ${{ inputs.args }}

      - name: Publish orphan data branch
        run: |
          cd data-branch
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "data: ${{ inputs.command }} $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Redeploy site
        run: gh workflow run deploy.yml --ref "${{ github.event.repository.default_branch }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Providers have occasional outages (CelesTrak connection errors): a single failed run only warns, and an
      # issue is opened (or commented) when the previous completed run of the same workflow failed too.
      - name: Report failure
        if: failure()
        run: |
          # In a reusable workflow, github.workflow_ref names the caller (owner/repo/.github/workflows/<file>@ref).
          workflow_file=$(basename "${GITHUB_WORKFLOW_REF%@*}")
          previous=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow_file" --status completed --limit 10 \
            --json databaseId,conclusion --jq "[.[] | select(.databaseId != ${GITHUB_RUN_ID})][0].conclusion // \"\"")
          if [ "$previous" != "failure" ]; then
            echo "::warning::${{ inputs.command }} failed once (previous run: ${previous:-none}); an issue is opened if the next run fails too."
            exit 0
          fi
          title="Data pipeline failed: ${{ inputs.command }}"
          body="Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} (second failure in a row)
          Previously published data was left untouched. The pipeline stops on any non-200 response;
          check the log before re-running (CelesTrak usage policy)."
          existing=$(gh issue list --state open --label data-pipeline --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh label create data-pipeline --color B60205 --force >/dev/null
            gh issue create --title "$title" --label data-pipeline --assignee "${{ github.repository_owner }}" --body "$body"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
