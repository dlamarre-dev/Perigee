# SATCAT metadata and CelesTrak group membership (operators), once a day.
name: Data — CelesTrak SATCAT and groups

on:
  schedule:
    - cron: '43 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  satcat:
    uses: ./.github/workflows/data-pipeline.yml
    with:
      command: satcat
