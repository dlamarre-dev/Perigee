# Solar active regions (sunspots) from NOAA SWPC (one request), daily after SWPC's 00:30 UT region report.
name: Data — Sun regions

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  sun:
    uses: ./.github/workflows/data-pipeline.yml
    with:
      command: sun
