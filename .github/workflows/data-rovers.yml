# Mars rover positions from NASA MMGIS waypoint feeds (one request per rover), daily.
name: Data — Mars rovers

on:
  schedule:
    - cron: '47 7 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  rovers:
    uses: ./.github/workflows/data-pipeline.yml
    with:
      command: rovers
