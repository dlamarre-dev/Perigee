name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  # Data workflows (M1+) trigger a redeploy after publishing the `data` branch.
  workflow_dispatch:
  repository_dispatch:
    types: [data-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The commit history without file contents (a few MB): the sitemap dates the guide pages by their last change
      # (vite.config.ts `lastChange`), which a shallow clone cannot see.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Served at the root of the custom domain (perigee.info, set in Settings → Pages).
          PERIGEE_BASE: /
      # From M1: copy the orphan `data` branch into dist/data (same origin → no CORS).
      - name: Copy published data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            # Its own shallow clone with the file contents: the repository above is blobless, and checking the data
            # out there would fetch every file one request at a time (12 min instead of seconds).
            git clone --quiet --depth 1 --branch data --single-branch --no-tags \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/data"
            mkdir -p dist/data
            git -C "$RUNNER_TEMP/data" archive HEAD | tar -x -C dist/data
          else
            echo "No data branch yet (expected before M1)."
          fi
      # README badges (Shields.io endpoint JSON): data freshness, satellites and missions tracked. Only a nicety: a
      # failure never blocks the deployment.
      - name: Badges
        continue-on-error: true
        run: npx tsx tools/badges/write-badges.ts dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
