name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  # Data workflows (M1+) trigger a redeploy after publishing the `data` branch.
  workflow_dispatch:
  repository_dispatch:
    types: [data-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PERIGEE_BASE: /${{ github.event.repository.name }}/
      # From M1: copy the orphan `data` branch into dist/data (same origin → no CORS).
      - name: Copy published data
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth 1 origin data
            mkdir -p dist/data
            git --work-tree=dist/data checkout origin/data -- .
          else
            echo "No data branch yet (expected before M1)."
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
