# Deploys the hosted MCP endpoint (workers/mcp, Cloudflare Workers) when its code, the engine or the catalogues it
# bundles change on master. Needs the CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers") and
# CLOUDFLARE_ACCOUNT_ID secrets (docs/mcp-hosted.md); without them the job only checks the bundle.
name: MCP worker

on:
  push:
    branches: [master]
    paths:
      - 'workers/mcp/**'
      - 'mcp/src/**'
      - 'mcp/package.json'
      - 'src/engine/**'
      - 'src/astro/**'
      - 'src/data/**'
      - 'src/earth/sgp4.ts'
      - 'src/i18n/**'
      - 'catalog/**'
      - '.github/workflows/mcp-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            workers/mcp/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: workers/mcp
      - run: npm run typecheck
      - run: npx vitest run tests/engine.test.ts tests/mcp.test.ts tests/mcpWorker.test.ts
      - run: npx wrangler deploy --dry-run --outdir dist
        working-directory: workers/mcp
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
        working-directory: workers/mcp
