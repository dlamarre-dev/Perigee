# Publishes the MCP server (mcp/, npm package perigee-mcp) when a tag mcp-v<version> is pushed, through npm trusted
# publishing (OIDC: no npm token stored in GitHub; provenance attached automatically). The trusted publisher is set
# on npmjs.com for this repository and this file name (docs/mcp-publishing.md).
name: MCP release

on:
  push:
    tags: ['mcp-v*']

permissions:
  contents: read
  id-token: write

# GitHub sometimes delivers a tag push more than once: runs for the same tag wait for each other.
concurrency:
  group: mcp-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Tag matches mcp/package.json
        run: |
          version=$(node -p "require('./mcp/package.json').version")
          test "mcp-v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match $version"; exit 1; }
      - name: server.json matches mcp/package.json
        run: |
          version=$(node -p "require('./mcp/package.json').version")
          test "$(node -p "require('./mcp/server.json').version")" = "$version" || { echo "mcp/server.json version differs"; exit 1; }
          test "$(node -p "require('./mcp/server.json').packages[0].version")" = "$version" || { echo "mcp/server.json package version differs"; exit 1; }
          test "$(node -p "require('./mcp/server.json').name")" = "$(node -p "require('./mcp/package.json').mcpName")" || { echo "mcpName differs from server.json name"; exit 1; }
      - run: npm run typecheck
      - run: npx vitest run tests/engine.test.ts tests/mcp.test.ts
      - run: npm run mcp:build
      # A version already on npm (the first one is published by hand) is not published again.
      - name: Already published?
        id: published
        run: |
          version=$(node -p "require('./mcp/package.json').version")
          if npm view "perigee-mcp@$version" version >/dev/null 2>&1; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      # npm takes a few minutes to list a new version, so a duplicate run can miss it above: its 409
      # ("cannot publish over previously published/staged version") means the version is already there.
      - if: steps.published.outputs.skip != 'true'
        name: Publish
        working-directory: mcp
        run: |
          set +e
          npm publish --access public 2>&1 | tee "$RUNNER_TEMP/publish.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ] && grep -qE 'E409|previously (published|staged) version' "$RUNNER_TEMP/publish.log"; then
            echo "::notice::perigee-mcp $(node -p "require('./package.json').version") is already on npm."
            exit 0
          fi
          exit "$status"
      # Lists the version in the official MCP Registry (registry.modelcontextprotocol.io), which checks that the npm
      # package carries the same mcpName. GitHub OIDC proves the io.github.dlamarre-dev namespace: no token stored.
      # A version already in the registry is refused, so a duplicate run only warns.
      # npm can take well over 5 minutes to list a new version ("being processed"), and the registry refuses a
      # version npm does not list yet: wait for npm first (up to 45 min), then publish. Still not listed, or still
      # refused for that reason only, is a warning (re-run this job later), not a failed release.
      - name: Publish to the MCP Registry
        working-directory: mcp
        timeout-minutes: 60
        run: |
          version=$(node -p "require('./package.json').version")
          for wait in $(seq 1 90); do
            npm view "perigee-mcp@$version" version --prefer-online >/dev/null 2>&1 && break
            if [ "$wait" -eq 90 ]; then
              echo "::warning::npm still does not list perigee-mcp $version after 45 min: re-run this job to list it in the MCP Registry."
              exit 0
            fi
            sleep 30
          done
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.6/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          for attempt in 1 2 3 4 5; do
            ./mcp-publisher publish 2>&1 | tee "$RUNNER_TEMP/registry.log"
            [ "${PIPESTATUS[0]}" -eq 0 ] && exit 0
            if grep -qiE 'already exists|duplicate|cannot publish duplicate' "$RUNNER_TEMP/registry.log"; then
              echo "::notice::This version is already in the MCP Registry."
              exit 0
            fi
            # Any other refusal is a real error.
            grep -qiE "version '[^']*' was not found" "$RUNNER_TEMP/registry.log" || exit 1
            # The registry may read npm through a cache that lags behind: wait and try again.
            sleep 120
          done
          echo "::warning::The MCP Registry does not see perigee-mcp $version on npm yet: re-run this job later."
      # Glama has no API to build or release a server: remind the maintainer in the run summary (docs/mcp-publishing.md §7).
      - name: Glama reminder
        run: |
          version=$(node -p "require('./mcp/package.json').version")
          {
            echo "### Manual step: Glama"
            echo ""
            echo "On https://glama.ai/mcp/servers/dlamarre-dev/Perigee (logged in): run a new build, then create the release \`$version\`."
            echo "The build installs the latest \`perigee-mcp\` from npm, so wait until npm lists $version."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Glama::Rebuild Perigee on Glama and create the release $version (docs/mcp-publishing.md §7)."

  # Scores the released tool definitions on tdqs.dev (Tool Definition Quality Score, one of the account's 30 daily
  # API calls) and points the README badges at the new report through a pull request (docs/mcp-publishing.md §8).
  # Each score is a new report with its own id: the badge cannot follow by itself.
  tdqs:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the badge branch
      pull-requests: write # open the PR and enable auto-merge
      actions: write # start CI on it: a PR opened with GITHUB_TOKEN triggers no workflow
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run mcp:build
      - name: Score on tdqs.dev
        id: score
        env:
          TDQS_API_KEY: ${{ secrets.TDQS_API_KEY }}
        run: |
          if [ -z "$TDQS_API_KEY" ]; then
            echo "::warning title=TDQS::No TDQS_API_KEY secret: the tools were not scored and the badge is unchanged."
            exit 0
          fi
          set +e
          npx tdqs score --command "node mcp/dist/perigee-mcp.js" --server-name Perigee --hosted https://tdqs.dev \
            --fail-under B --format markdown --output "$RUNNER_TEMP/tdqs.md" 2> "$RUNNER_TEMP/tdqs.err"
          status=$?
          set -e
          cat "$RUNNER_TEMP/tdqs.err" >&2
          [ -f "$RUNNER_TEMP/tdqs.md" ] && cat "$RUNNER_TEMP/tdqs.md" >> "$GITHUB_STEP_SUMMARY"
          uid=$(grep -oE 'report: https://tdqs\.dev/reports/[A-Za-z0-9_-]+' "$RUNNER_TEMP/tdqs.err" | sed 's|.*/||' | tail -n 1)
          echo "uid=$uid" >> "$GITHUB_OUTPUT"
          # Exit 1: scored below B (the badge still shows the real score); 2: the scoring itself failed.
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Badge pull request
        if: steps.score.outputs.uid != ''
        env:
          GH_TOKEN: ${{ github.token }}
          UID_NEW: ${{ steps.score.outputs.uid }}
        run: |
          version=$(node -p "require('./mcp/package.json').version")
          sed -i -E "s#tdqs\.dev/reports/[A-Za-z0-9_-]+#tdqs.dev/reports/$UID_NEW#g" README.md mcp/README.md
          if git diff --quiet; then echo "The badges already show report $UID_NEW."; exit 0; fi
          branch="tdqs/mcp-v$version"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "docs: TDQS badge for perigee-mcp $version" -m "Report: https://tdqs.dev/reports/$UID_NEW"
          git push --force origin "$branch"
          gh pr create --base master --head "$branch" --title "docs: TDQS badge for perigee-mcp $version" \
            --body "The release workflow scored the tool definitions of perigee-mcp $version: https://tdqs.dev/reports/$UID_NEW. This PR points the README badges at that report; CI was started by the workflow and the PR merges itself once it passes."
          gh workflow run ci.yml --ref "$branch"
          gh pr merge "$branch" --auto --squash --delete-branch
      - name: Score threshold
        if: steps.score.outputs.status != '' && steps.score.outputs.status != '0'
        run: |
          echo "::error title=TDQS::tdqs score exited with ${{ steps.score.outputs.status }} (1: below B, 2: scoring failed); see the log of the Score step."
          exit 1
