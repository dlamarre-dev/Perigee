name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  # Started by mcp-release.yml for its TDQS badge PR: a pull request opened with GITHUB_TOKEN triggers no workflow.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pull requests from the weekly maintenance agent: curated files only, sourced entries, no deletions.
  catalog-guard:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'maintenance/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsx pipeline/catalog-guard.ts "origin/${{ github.base_ref }}"

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run mcp:build
      # Tool Definition Quality Score lint (tdqs.dev rules, local: no model, no network request).
      - run: npx tdqs lint --command "node mcp/dist/perigee-mcp.js" --server-name Perigee --fail-on error --format markdown >> "$GITHUB_STEP_SUMMARY"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
