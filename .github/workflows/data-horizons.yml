# JPL Horizons state vectors for every mission of catalog/missions.json with ephemeris "horizons", daily.
name: Data — JPL Horizons

on:
  schedule:
    - cron: '29 6 * * *'
  workflow_dispatch:
    inputs:
      bootstrap_past:
        description: 'Also fetch the 30 days before each window (one extra request per mission, once: starts the archive)'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  horizons:
    uses: ./.github/workflows/data-pipeline.yml
    with:
      command: horizons
      args: ${{ inputs.bootstrap_past && '--bootstrap-past' || '' }}
